name: Protocol Check

on:
  push:
    branches: [main]
    paths:
      - 'protocol/**'
      - '.github/workflows/protocol-check.yml'
  pull_request:
    paths:
      - 'protocol/**'
      - '.github/workflows/protocol-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate JSON Schema
        run: python3 -c "import json; json.load(open('protocol/schema/messages.json'))"

      - name: Validate example payloads
        run: |
          for f in protocol/examples/*.json; do
            echo "Checking $f..."
            python3 -c "import json; json.load(open('$f'))"
          done
          echo "All examples valid."
