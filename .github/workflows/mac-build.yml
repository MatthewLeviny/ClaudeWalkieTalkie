name: Mac Build

on:
  push:
    paths:
      - 'mac-app/**'
      - 'protocol/**'
      - '.github/workflows/mac-build.yml'
  pull_request:
    paths:
      - 'mac-app/**'
      - 'protocol/**'
      - '.github/workflows/mac-build.yml'

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: mac-app
    steps:
      - uses: actions/checkout@v6

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release
